name: Update index date

on:
  schedule:
    # 00:05 Africa/Cairo (UTC+3) → 21:05 UTC previous calendar day
    - cron: "5 21 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/index.md"
      - "scripts/update_index_date.py"
      - ".github/workflows/update-index-date.yml"

permissions:
  contents: write

concurrency:
  group: update-index-date
  cancel-in-progress: true

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update today's date in docs/index.md
        id: date
        run: |
          python scripts/update_index_date.py
          if git diff --quiet -- docs/index.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated date
        if: steps.date.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          git commit -m "chore: update index date to $(date -u +%Y-%m-%d)"
          git push

      - name: Install MkDocs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.date.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mkdocs \
            mkdocs-material \
            pymdown-extensions \
            mkdocs-video \
            mkdocs-pdf

      - name: Deploy site to GitHub Pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.date.outputs.changed == 'true'
        run: mkdocs gh-deploy --force --clean --message "deploy: refresh index date"
